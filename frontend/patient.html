<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Patient Intake Form</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="patient.css" />
</head>

<body>

<div class="page">
  
  <div class="card">

    <h2>Patient Intake Form</h2>

    <form id="patientForm">

      <h3>Patient Details</h3>

      <div class="row">
        <input type="text" placeholder="First Name" name="first_name" required />
        <input type="text" placeholder="Last Name" name="last_name" required />
      </div>

      <div class="row">
        <input type="date" name="dob" required />
      </div>

      <div class="question">
        <label>Returning Patient</label>
        <div>
          <label><input type="radio" name="returning_patient" value="1"> Yes</label>
          <label><input type="radio" name="returning_patient" value="0"> No</label>
        </div>
      </div>

      <h3>Symptoms</h3>

      <div class="question">
        <label>Chest Pain</label>
        <label><input type="radio" name="chest_pain" value="1"> Yes</label>
        <label><input type="radio" name="chest_pain" value="0"> No</label>
      </div>

      <div class="question">
        <label>Shortness of Breath</label>
        <label><input type="radio" name="shortness_of_breath" value="1"> Yes</label>
        <label><input type="radio" name="shortness_of_breath" value="0"> No</label>
      </div>

      <div class="question">
        <label>Smoking / Tobacco Use</label>
        <label><input type="radio" name="smoking" value="1"> Yes</label>
        <label><input type="radio" name="smoking" value="0"> No</label>
      </div>

      <!-- <h3>Medical Conditions</h3>
      <p> Do you have any of the following conditions?</p>
      <div class="checkbox-group">
        <label><input type="checkbox" name="diabetes"> Diabetes</label>
        <label><input type="checkbox" name="hypertension"> Hypertension</label>
        <label><input type="checkbox" name="cad"> Coronary Artery Disease</label>
        <label><input type="checkbox" name="mi"> Myocardial Infarction</label>
        <label><input type="checkbox" name="heart_disease"> Heart Disease</label>
        <label><input type="checkbox" name="cvd"> Cardiovascular Disease</label>
      </div> -->

      <div class="submit-container">
        <button type="submit">Submit</button>
      </div>

    </form>

  </div>

</div>

<script src="patient.js"></script>

</body>
</html>
